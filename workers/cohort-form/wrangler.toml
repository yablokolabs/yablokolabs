# Yabloko Labs cohort interest endpoint — Cloudflare Worker
# See README.md for setup. Deploy with `npm run deploy`.

name = "cohort-form"
main = "src/index.js"
compatibility_date = "2026-08-01"

[vars]
# Sender on your own domain. The address must be on a domain in this Cloudflare
# account, and Email Sending must be enabled for that domain.
COHORT_FROM = "cohort@yablokolabs.com"
# Where interest submissions land when email is available. This must be a
# verified Email Routing destination address; arbitrary recipients need Workers
# Paid (see README.md). Leave empty to skip email and deliver to Telegram.
COHORT_NOTIFY_TO = "cohort@yablokolabs.com"

# Telegram fallback: set both as secrets, never as vars here.
#   npx wrangler secret put TELEGRAM_BOT_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
ALLOWED_ORIGINS = "https://yablokolabs.com,https://www.yablokolabs.com,http://localhost:3000"
RATE_LIMIT_PER_HOUR = "5"

# Outbound mail (Cloudflare Email Service, public beta). The binding has no
# extra configuration; the vars above decide from/to.
[[send_email]]
name = "EMAIL"

# Optional: keep a backup copy of every submission. Create the namespace with
#   npx wrangler kv namespace create SUBMISSIONS
# then paste the id as `id` below. Without this binding the worker still works —
# it relies on the notification email (or Telegram) alone.
# [[kv_namespaces]]
# binding = "SUBMISSIONS"
# id = "<paste-kv-namespace-id>"

# Custom domain for the endpoint the /cohort page posts to. Cloudflare creates
# the DNS record and certificate on deploy. Until the first successful deploy
# the worker is also reachable at
# https://cohort-form.<account>.workers.dev.
[[routes]]
pattern = "cohort-form.yablokolabs.com"
custom_domain = true
